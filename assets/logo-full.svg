<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Selleh Shop Kenya — Quality, Trust, Delivery">
  <defs>
    <linearGradient id="gf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d675"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8842a"/>
    </linearGradient>
  </defs>

  <circle cx="320" cy="320" r="298" fill="#0a0a0a" stroke="url(#gf)" stroke-width="10"/>
  <circle cx="320" cy="320" r="270" fill="none" stroke="url(#gf)" stroke-width="1.5" opacity="0.45"/>

  <!-- Monogram -->
  <text x="320" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" text-anchor="middle">
    <tspan fill="url(#gf)">S</tspan><tspan fill="#ffffff">K</tspan>
  </text>
  <g transform="translate(352,282) scale(1.9)" fill="none" stroke="url(#gf)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    <circle cx="6" cy="20" r="2" fill="url(#gf)" stroke="none"/>
    <circle cx="18" cy="20" r="2" fill="url(#gf)" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <text x="320" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" text-anchor="middle">
    <tspan fill="#ffffff">SELLEH </tspan><tspan fill="url(#gf)">SHOP</tspan>
  </text>

  <line x1="230" y1="408" x2="278" y2="408" stroke="url(#gf)" stroke-width="1.5"/>
  <text x="320" y="415" font-family="Georgia, serif" font-size="22" letter-spacing="8" fill="#f4efe3" text-anchor="middle">KENYA</text>
  <line x1="362" y1="408" x2="410" y2="408" stroke="url(#gf)" stroke-width="1.5"/>

  <!-- Icon row: package / shield-check / truck -->
  <g transform="translate(240,450)" fill="none" stroke="url(#gf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 21 7v10l-9 4-9-4V7z"/>
    <path d="M3.3 7 12 11l8.7-4"/>
    <path d="M12 21V11"/>
  </g>
  <line x1="278" y1="462" x2="278" y2="480" stroke="url(#gf)" stroke-width="1" opacity="0.5"/>
  <g transform="translate(308,450)" fill="none" stroke="url(#gf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 4 5.5v6c0 5.2 3.4 8.8 8 10 4.6-1.2 8-4.8 8-10v-6z"/>
    <path d="M8.5 12 11 14.5 16 9.5"/>
  </g>
  <line x1="346" y1="462" x2="346" y2="480" stroke="url(#gf)" stroke-width="1" opacity="0.5"/>
  <g transform="translate(376,452)" fill="none" stroke="url(#gf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 4h14v11H1z"/>
    <path d="M15 9h4l3.5 3.5V15H15z"/>
    <circle cx="6" cy="18.5" r="2.3" fill="url(#gf)" stroke="none"/>
    <circle cx="18.5" cy="18.5" r="2.3" fill="url(#gf)" stroke="none"/>
  </g>

  <text x="320" y="506" font-family="Poppins, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#c9c4b6" text-anchor="middle">QUALITY &#8226; TRUST &#8226; DELIVERY</text>

  <!-- Kenyan flag accent -->
  <g transform="translate(297,528)">
    <rect x="0" y="0" width="46" height="27" rx="2" fill="#ffffff"/>
    <rect x="0" y="0" width="46" height="8" fill="#000000"/>
    <rect x="0" y="19" width="46" height="8" fill="#006600"/>
    <rect x="0" y="8" width="46" height="11" fill="#bb0000"/>
  </g>
